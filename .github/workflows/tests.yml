name: Executar os testes com o GitActions

on:
  push:
    branches: [ Master, QA, Homolog]
  pull_request:
    branches: [ Master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Subir Selenium Grid (Docker)
      run: docker compose up -d

    - name: Aguardar o Selenium
      run: |
           timeout 60s bash -c 'until curl -s http://localhost:4444/wd/hub/status | grep "ready"; do sleep 5; done'

    - name: Restaurar Dependências
      run: dotnet restore

    - name: Executar Testes
      run: dotnet test --configuration Debug --logger "trx;LogFileName=test_results.trx"

    - name: Instalar SpecFlow LivingDoc Tool
      run: dotnet tool install SpecFlow.Plus.LivingDoc.CLI --tool-path ./tools

    - name: Gerar LivingDoc
      if: always()
      run: |
        ./tools/livingdoc test-assembly bin/Debug/net8.0/ProjetoSeleniumMock.dll -t bin/Debug/net8.0/TestExecution.json

    - name: Upload do Relatório
      uses: actions/upload-artifact@v4
      with:
        name: Relatorio-SpecFlow
        path: LivingDoc.html
      if: always()